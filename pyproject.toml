[project]
name = "stock-exchange"
version = "0.1.0"
description = "Educational stock exchange — learning how trading works"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "base",
    "gateway",
    "market_data",
    "account",
    "matching_engine",
    "risk_engine",
    "order_management",
    "clearing",
    "notifications",
]

[project.optional-dependencies]
tui = [
    "textual>=0.80",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clients*"]

[tool.uv.workspace]
members = ["platform/base", "platform/gateway", "platform/market_data", "platform/account", "platform/matching_engine", "platform/risk_engine", "platform/order_management", "platform/clearing", "platform/notifications"]

[tool.uv.sources]
base = { workspace = true }
gateway = { workspace = true }
market_data = { workspace = true }
account = { workspace = true }
matching_engine = { workspace = true }
risk_engine = { workspace = true }
order_management = { workspace = true }
clearing = { workspace = true }
notifications = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["clients", "platform"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["platform/base/src", "platform/gateway/src", "platform/market_data/src", "platform/account/src", "platform/matching_engine/src", "platform/risk_engine/src", "platform/order_management/src", "platform/clearing/src", "platform/notifications/src"]
omit = ["*/tests/*", "clients/*"]

# optional config below

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
exclude = ["docs/**/*.py"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "E", "B", "I", "PL", "C90"]
ignore = ["PLR2004", "PLC0415"]

fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = [
  "Depends",
  "fastapi.Depends",
  "fastapi.params.Depends",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = false
fail-under = 0
exclude = [
  "setup.py",
  "docs",
  "build",
  "**/__init__.py",
  "CHANGELOG.md",
]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
ext = []
# possible values: sphinx (default), google
style = "sphinx"
# possible values: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

# [tool.pytest.ini_options]
# # https://docs.pytest.org/en/latest/reference/customize.html
# minversion = "6.0"
# addopts = "--doctest-modules -vv --cov=ministelo --capture=no --log-cli-level=INFO --import-mode=importlib tests"
# testpaths = ["tests"]
# log_format = "%(asctime)s [%(levelname)-8s] [%(filename)s:%(lineno)s] %(message)s"
# log_date_format = "%H:%M:%S"
# asyncio_default_fixture_loop_scope = "function"
# filterwarnings = ["ignore::DeprecationWarning"]

# Reminder:
# '^file1\.py$',   # TOML literal string (single-quotes, no escaping necessary)
# "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B301", "B601"]

[tool.pymarkdown]
plugins.md013.enabled = false

[dependency-groups]
dev = [
    "ty>=0.0.37",
]
