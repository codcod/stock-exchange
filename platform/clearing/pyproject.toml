[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearing"
version = "0.0.1"
description = "Clearing — post-trade trade-record keeper (audit ledger only)"
requires-python = ">=3.11"
dependencies = [
    "base",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.uv.sources]
base = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/clearing"]
