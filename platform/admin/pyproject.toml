[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin"
version = "0.0.1"
description = "Read-only ops dashboard (Datastar/SSE) over the exchange's services"
requires-python = ">=3.11"
dependencies = [
    "base",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[tool.uv.sources]
base = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/admin"]
