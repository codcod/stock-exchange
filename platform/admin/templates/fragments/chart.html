<svg id="chart" viewBox="0 0 {{ width }} {{ height }}" preserveAspectRatio="none" data-series="{{ series_json }}" data-step="{{ step }}" data-pad-l="{{ pad_l }}">{% for g in gridlines %}<line x1="{{ pad_l }}" y1="{{ g.y }}" x2="{{ width - pad_r }}" y2="{{ g.y }}" stroke="var(--border)" stroke-width="1"/><text x="{{ pad_l - 8 }}" y="{{ g.label_y }}" text-anchor="end" font-size="9" fill="var(--text-dim)" font-family="var(--font-mono)">{{ g.label }}</text>{% endfor %}{% for s in series %}<path d="{{ s.path }}" fill="none" stroke="{{ s.color }}" stroke-width="2"/><circle cx="{{ s.last_x }}" cy="{{ s.last_y }}" r="3" fill="{{ s.color }}"/>{% endfor %}</svg>
