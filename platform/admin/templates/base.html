<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Exchange Console{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0d14;
  --panel: #10141f;
  --panel-2: #0d111a;
  --border: #1e2434;
  --text: #e8ecf5;
  --text-muted: #7c869c;
  --text-dim: #4d5568;
  --accent: #2fe0c4;
  --accent-dim: rgba(47, 224, 196, 0.14);
  --good: #3ddc84;
  --bad: #ff5d7a;
  --warn: #ffb454;
  --submitted: #6c8dff;
  --executed: #ffb454;
  --filled: #3ddc84;
  --font-display: "Sora", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-display);
  padding-inline: 20px;
  padding-block: 28px 48px;
  max-width: 1180px;
  margin-inline: auto;
}

.mono { font-family: var(--font-mono); }
.tabular { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.topbar h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.topbar .sub {
  color: var(--text-muted);
  font-size: 0.82rem;
}
.live-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--good);
  background: rgba(61, 220, 132, 0.1);
  border: 1px solid rgba(61, 220, 132, 0.3);
  padding: 5px 11px;
  border-radius: 999px;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.6);
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.55); }
  70% { box-shadow: 0 0 0 6px rgba(61, 220, 132, 0); }
  100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); }
}
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* ---------- funnel row ---------- */
.funnel-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}
.hero-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.hero-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.78rem; color: var(--text-muted); font-weight: 600;
}
.swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.hero-rate { font-size: 0.78rem; color: var(--text-muted); }
.hero-rate span { color: var(--text); font-weight: 600; }
.hero-value {
  font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px;
}
.spark { width: 100%; height: 32px; display: block; }

/* ---------- metric row ---------- */
.metric-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.metric-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}
.metric-label { font-size: 0.74rem; color: var(--text-muted); margin-bottom: 6px; }
.metric-value { font-size: 1.3rem; font-weight: 600; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.7rem; font-family: var(--font-mono);
  padding: 2px 7px; border-radius: 999px; margin-top: 8px;
}
.chip.good { background: rgba(61,220,132,0.12); color: var(--good); }
.chip.warn { background: rgba(255,180,84,0.12); color: var(--warn); }
.chip.bad  { background: rgba(255,93,122,0.12); color: var(--bad); }

/* ---------- two-col ---------- */
.two-col {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
@media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px 18px;
}
.panel-hd {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.panel-hd h2 { font-size: 0.92rem; font-weight: 600; margin: 0; }
.legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--text-muted); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-line { width: 10px; height: 2px; display: inline-block; border-radius: 1px; }

.chart-box { position: relative; }
#chart { width: 100%; height: 200px; display: block; }
.tooltip {
  position: absolute; top: 4px; pointer-events: none; opacity: 0;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 9px; font-size: 0.7rem; font-family: var(--font-mono);
  transition: opacity 0.1s; white-space: nowrap;
}
.t-row { display: flex; align-items: center; gap: 6px; }
.t-sw { width: 7px; height: 7px; border-radius: 2px; }
.t-val { margin-left: auto; padding-left: 10px; color: var(--text); }
.t-time { color: var(--text-muted); margin-bottom: 3px; }

/* ---------- ticker bars ---------- */
.ticker-row { margin-bottom: 13px; }
.ticker-row:last-child { margin-bottom: 0; }
.ticker-hd {
  display: flex; justify-content: space-between; font-size: 0.78rem;
  margin-bottom: 5px;
}
.ticker-hd .sym { font-weight: 700; font-family: var(--font-mono); }
.ticker-hd .vol { color: var(--text-muted); font-family: var(--font-mono); }
.ticker-bar {
  display: flex; height: 7px; border-radius: 4px; overflow: hidden;
  background: var(--panel-2);
}
.ticker-bar .buy { background: var(--good); }
.ticker-bar .sell { background: var(--bad); }

/* ---------- feed ---------- */
table.feed { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
table.feed th {
  text-align: left; font-weight: 600; color: var(--text-muted);
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 0 10px 8px; border-bottom: 1px solid var(--border);
}
table.feed td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
table.feed tr:last-child td { border-bottom: none; }
.pill { font-size: 0.68rem; font-family: var(--font-mono); padding: 2px 7px; border-radius: 999px; }
.pill.filled { background: rgba(61,220,132,0.12); color: var(--good); }
.pill.partial { background: rgba(108,141,255,0.12); color: var(--submitted); }
.pill.rejected { background: rgba(255,93,122,0.12); color: var(--bad); }
.side-buy { color: var(--good); font-weight: 600; }
.side-sell { color: var(--bad); font-weight: 600; }

footer.note {
  margin-top: 22px; font-size: 0.72rem; color: var(--text-dim);
  font-family: var(--font-mono); text-align: center;
}

/* ---------- tabs ---------- */
.tabs {
  display: flex; gap: 4px; margin-bottom: 18px;
  border: 1px solid var(--border); border-radius: 9px; padding: 3px;
  width: fit-content; background: var(--panel);
}
.tab {
  font-family: var(--font-display); font-size: 0.82rem; font-weight: 600;
  color: var(--text-muted); background: transparent; border: none;
  padding: 7px 16px; border-radius: 6px; cursor: pointer;
}
.tab.active { background: var(--accent-dim); color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }

/* ---------- services grid ---------- */
.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 14px;
}
.service-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.service-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 3px;
}
.service-name { display: flex; align-items: baseline; gap: 8px; }
.service-name strong { font-size: 0.98rem; font-weight: 700; }
.service-port { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
.status-pill {
  font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.03em;
  padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
}
.status-pill.up { background: rgba(61,220,132,0.12); color: var(--good); }
.status-pill.up::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
.status-pill.down { background: rgba(255,93,122,0.12); color: var(--bad); }
.status-pill.down::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--bad); }
.service-role { font-size: 0.76rem; color: var(--text-muted); margin-bottom: 14px; }
.service-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
}
.service-stat .label { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
.service-stat .value { font-size: 1rem; font-weight: 600; }
.service-note { font-size: 0.72rem; color: var(--text-muted); line-height: 1.45; }
.service-note .warn-flag { color: var(--warn); }

@media (max-width: 480px) {
  .topbar { flex-direction: column; align-items: flex-start; }
  .service-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body data-on-load="@get('/events', {retryMaxCount: 100})">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script type="module" src="/static/datastar.js"></script>
</body>
</html>
