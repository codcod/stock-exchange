name: CI (notifications)

on:
  push:
    branches: [main]
    paths: ["platform/notifications/**", "platform/base/**", "uv.lock"]
  pull_request:
    paths: ["platform/notifications/**", "platform/base/**", "uv.lock"]

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: notifications
