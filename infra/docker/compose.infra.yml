# Core infrastructure — Postgres only.
# Run with: just infra-up
# Services connect via the named 'exchange' network.

name: exchange

networks:
  default:
    name: exchange
    external: true

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U exchange"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
